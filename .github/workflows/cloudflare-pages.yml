name: Deploy to Cloudflare Pages

# Publishes JurisMind to Cloudflare Pages on every push to main, and builds a
# preview URL for pull requests. No secrets are required for the build itself:
# Cloudflare Pages can build this repo directly (see docs/CLOUDFLARE.md), and
# this workflow is the alternative path if you prefer CI-driven deploys.
#
# Required repository secrets (only for this workflow):
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# And one variable:
#   CLOUDFLARE_PROJECT_NAME — the Pages project name (e.g. jurismind)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the pages and the Cloudflare bundle
        run: |
          node tools/build.mjs
          node tools/cf-build.mjs

      - name: Check the build output
        run: |
          test -f dist/index.html
          test -f dist/fr/index.html
          test -f dist/ar/index.html
          test -f dist/assets/css/jurismind.css
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap.xml
          echo "dist/ contains $(find dist -type f | wc -l) files"

      # Fail the build if a page or a translation key went missing
      - name: Sanity-check every page in the three languages
        run: |
          for lang in "" "fr/" "ar/"; do
            for page in index dashboard path practice subjects tutor; do
              f="dist/${lang}${page}.html"
              [ -f "$f" ] || { echo "missing $f"; exit 1; }
              grep -q 'id="jm-content"' "$f" || { echo "no content dictionary in $f"; exit 1; }
              grep -q 'class="flag"' "$f" || { echo "language picker missing from $f"; exit 1; }
            done
          done
          echo "21 pages verified"

      - uses: actions/upload-artifact@v4
        with:
          name: jurismind-dist
          path: dist
          retention-days: 7

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'jurismind' }} --branch=main

  preview:
    name: Preview deploy for the pull request
    if: github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node tools/cf-build.mjs

      - name: Publish a preview branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'jurismind' }} --branch=${{ github.head_ref }}
